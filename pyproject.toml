[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "MolScribe"
version = "1.1.4"
description = "MolScribe"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yujie Qian", email = "yujieq@csail.mit.edu" },
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy<2",
    "torch==2.2.*",
    "timm>=0.9.16,<1",  # originally ^0.9.16
    "rdkit",
    "opencv-python>=4.6.0,<5",
    "pandas>=2.2.3,<3",
    "matplotlib>=3",
    "opennmt-py<3",
    "smilespe==0.0.3",
    "albumentations>=1.1,<2",
    "ctranslate2<=4.3.1",
]

[project.urls]
Homepage = "https://github.com/thomas0809/MolScribe"

[tool.hatch.build]
include = ["molscribe/vocab/*"]

[tool.hatch.build.targets.wheel]
packages = ["molscribe"]